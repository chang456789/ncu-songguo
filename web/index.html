<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="中央大學學生的匿名生活圈：公車時刻、拼車、二手市集、租屋與宿舍、系所看板、美食地圖。">
<meta name="theme-color" content="#235c45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="松果">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>松果中大生活通</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell. Top bar + tab row on desktop, bottom tab bar on phones; one content column (max 1040px).
   Signature details: pine-forest hero drawn in code, blue Taiwanese address plates (門牌) for every building,
   departure-board digits for bus times. */
:root{
  --bg:#f1f4f0; --surface:#ffffff; --sunk:#e6ebe4; --ink:#14211b; --muted:#56655d; --line:#d5ddd3;
  --pine:#235c45; --pine-ink:#ffffff; --pine-soft:#dcebe2;
  --plate:#1d4f9e; --plate-ink:#ffffff;
  --bus:#c98a00; --bus-soft:#fbf0d4; --board:#17201c; --board-ink:#ffd36b;
  --warn:#b23f0e; --warn-soft:#fbe8de; --ok:#2a7a55;
  --fc1:#235c45; --fc2:#c98a00; --fc3:#c2552b; --fc4:#1d4f9e; --fc5:#7a3fa0; --fc6:#c23a6e; --map-bg:#eef2ea; --map-grid:#dbe3d6;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1411; --surface:#151e1a; --sunk:#1b2621; --ink:#e3ebe6; --muted:#93a59b; --line:#26332c;
  --pine:#4f9c7a; --pine-ink:#08120d; --pine-soft:#1d3229;
  --plate:#3b6fc4; --plate-ink:#ffffff;
  --bus:#f0b43a; --bus-soft:#33280f; --board:#0a0f0d; --board-ink:#ffd36b;
  --warn:#f08a4b; --warn-soft:#3a2418; --ok:#5bbf8e; --fc1:#5bb08a; --fc2:#f0b43a; --fc3:#f08a5b; --fc4:#6b9be6; --fc5:#b685d6; --fc6:#e8789f; --map-bg:#121a16; --map-grid:#1f2a24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1411; --surface:#151e1a; --sunk:#1b2621; --ink:#e3ebe6; --muted:#93a59b; --line:#26332c;
  --pine:#4f9c7a; --pine-ink:#08120d; --pine-soft:#1d3229;
  --plate:#3b6fc4; --plate-ink:#ffffff;
  --bus:#f0b43a; --bus-soft:#33280f; --board:#0a0f0d; --board-ink:#ffd36b;
  --warn:#f08a4b; --warn-soft:#3a2418; --ok:#5bbf8e; --fc1:#5bb08a; --fc2:#f0b43a; --fc3:#f08a5b; --fc4:#6b9be6; --fc5:#b685d6; --fc6:#e8789f; --map-bg:#121a16; --map-grid:#1f2a24; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- shell ---------- */
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;background:none;border:0;padding:0;text-align:left}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-family:var(--f-data);font-size:10px;color:var(--muted);letter-spacing:.12em;margin-top:3px}
.online-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.online-pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.me-btn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;max-width:180px}
.me-btn .av{width:26px;height:26px;border-radius:50%;background:var(--pine);color:var(--pine-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.me-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs{max-width:1040px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 10px;color:var(--muted);font-weight:500;white-space:nowrap;position:relative}
.tab svg{width:18px;height:18px}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pine)}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px;font-family:var(--f-data)}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
@media (max-width:720px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:none;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:0}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;border-bottom:0;flex:1}
  .tab[aria-current="page"]{color:var(--pine)}
  .tab .badge{position:absolute;top:0;right:calc(50% - 22px)}
  .wrap{padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
  .online-pill b{display:none}
  .me-btn{padding-right:4px}.me-btn span{display:none}
}

/* ---------- shared atoms ---------- */
.plate{display:inline-flex;align-items:center;background:var(--plate);color:var(--plate-ink);border-radius:4px;padding:2px 3px;font-weight:700;font-size:12px;line-height:1.3;white-space:nowrap}
.plate>span{border:1px solid color-mix(in srgb,var(--plate-ink) 70%,transparent);border-radius:2px;padding:1px 7px}
.primary{background:var(--pine);color:var(--pine-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:700;white-space:nowrap}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--pine);padding:0;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0}
.section-title h2{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0;letter-spacing:.02em}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:700;margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.notice{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;font-size:13px;line-height:1.75}
.notice b{color:var(--warn)}
.info{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h3{margin:0;font-size:16px}
.empty p{margin:0;color:var(--muted);font-size:14px}
.ideas{display:flex;gap:8px;flex-wrap:wrap}
.ideas button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.ideas button:hover{border-color:var(--pine)}

/* ---------- home ---------- */
.hero{position:relative;border-radius:18px;overflow:hidden;background:var(--pine);color:var(--pine-ink);min-height:200px;display:flex;align-items:flex-end}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;padding:22px 22px 20px;display:flex;flex-direction:column;gap:6px;max-width:34rem}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,5vw,38px);line-height:1.15;margin:0;text-wrap:balance;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.hero p{margin:0;color:rgba(255,255,255,.9);font-size:14px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.qbtn{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.qbtn svg{width:22px;height:22px;color:var(--pine)}
.qbtn b{font-size:15px}
.qbtn span{font-size:12px;color:var(--muted)}
.qbtn:hover{border-color:var(--pine)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.li small{color:var(--muted);font-size:12px;white-space:nowrap}

/* ---------- departure board ---------- */
.board{background:var(--board);color:var(--board-ink);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;overflow-x:auto}
.board .row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed rgba(255,211,107,.18)}
.board .row:last-child{border-bottom:0}
.board .rt{font-family:var(--f-data);font-weight:600;font-size:18px;background:var(--board-ink);color:var(--board);border-radius:4px;text-align:center;padding:2px 0}
.board .dest{color:#f3efe2;font-size:14px;min-width:0}
.board .dest small{display:block;color:rgba(243,239,226,.6);font-size:11px}
.board .when{font-family:var(--f-data);font-size:20px;font-weight:600;text-align:right;white-space:nowrap}
.board .when small{display:block;font-size:11px;color:rgba(255,211,107,.75);font-weight:500}
.board .none{color:rgba(243,239,226,.5);font-size:13px}
.board-note{font-size:12px;color:var(--muted);margin:0}
.ttable{display:flex;flex-direction:column;gap:14px}
.troute{display:flex;flex-direction:column;gap:8px}
.troute h3{margin:0;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rtag{font-family:var(--f-data);font-weight:600;background:var(--bus);color:#1b1500;border-radius:4px;padding:0 8px}
.times{display:flex;flex-wrap:wrap;gap:6px}
.times span{font-family:var(--f-data);font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface)}
.times span.past{opacity:.4;text-decoration:line-through}
.times span.next{background:var(--bus);border-color:var(--bus);color:#1b1500;font-weight:600}

.rtag.r1{background:var(--bus);color:#1b1500}.rtag.r2{background:var(--pine);color:var(--pine-ink)}.rtag.r3{background:var(--plate);color:var(--plate-ink)}.rtag.r4{background:var(--warn);color:#fff}.rtag.r5{background:var(--ink);color:var(--bg)}
.rtag{display:inline-block;min-width:48px;text-align:center;font-size:12px}
.tlist{display:flex;flex-direction:column;max-height:420px;overflow-y:auto;margin:0 -4px}
.trow{display:grid;grid-template-columns:76px 56px minmax(0,1fr);gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .tt{font-size:14px;font-weight:600}
.trow.past{opacity:.4}
.trow.next{background:var(--bus-soft);border-radius:6px}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}
@media (max-width:520px){.trow{grid-template-columns:68px 52px minmax(0,1fr);gap:8px}}
/* ---------- rides ---------- */
.ride{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.ride .clock{font-family:var(--f-data);text-align:center;border-right:1px solid var(--line);padding-right:14px;min-width:64px}
.ride .clock b{display:block;font-size:22px;font-weight:600;line-height:1.1}
.ride .clock small{font-size:11px;color:var(--muted)}
.ride .route{display:flex;flex-direction:column;gap:2px;min-width:0}
.ride .route b{font-size:16px}
.ride .route small{color:var(--muted);font-size:12px}
.seats{display:flex;gap:3px}
.seats i{width:12px;height:16px;border-radius:3px 3px 2px 2px;border:1.5px solid var(--pine)}
.seats i.on{background:var(--pine)}
.ride-acts{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px}
@media (max-width:520px){.ride{grid-template-columns:auto minmax(0,1fr)}.ride .side{grid-column:1/-1}}

/* ---------- spaces ---------- */
.dir{display:flex;flex-direction:column;gap:12px}
.dir details{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.dir summary{cursor:pointer;padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;gap:10px;list-style:none}
.dir summary::-webkit-details-marker{display:none}
.dir summary::after{content:"＋";color:var(--muted);font-weight:400}
.dir details[open] summary::after{content:"－"}
.dir summary small{font-weight:400;color:var(--muted);margin-left:auto}
.dir .opts{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}
.spbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:13px}
.spbtn[aria-current="true"]{border-color:var(--pine);background:var(--pine-soft);font-weight:700}
.spbtn .n{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.spbtn .lane{font-size:11px;color:var(--muted)}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;width:max-content;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;border-radius:8px;padding:6px 14px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sphead{display:flex;flex-direction:column;gap:8px}
.sphead h1{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,4vw,30px);line-height:1.2;margin:0;text-wrap:balance}
.sphead p{margin:0;color:var(--muted);max-width:62ch;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.online-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.person{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 4px;font-size:13px}
.person i{width:20px;height:20px;border-radius:50%;background:var(--pine-soft);color:var(--pine);font-style:normal;display:grid;place-items:center;font-size:11px;font-weight:700;position:relative}
.person i::after{content:"";position:absolute;right:-1px;bottom:-1px;width:7px;height:7px;border-radius:50%;background:var(--ok);border:1.5px solid var(--surface)}
.person:hover{border-color:var(--pine)}

/* ---------- posts ---------- */
.feed{display:flex;flex-direction:column;gap:12px}
.post{display:flex;flex-direction:column;gap:8px;min-width:0}
.post .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.cat{font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 8px;border-radius:4px;background:var(--sunk);color:var(--ink)}
.cat.warn{background:var(--warn-soft);color:var(--warn)}
.where{font-size:12px;color:var(--pine);font-weight:700}
.post h3{margin:0;font-size:17px;line-height:1.4;overflow-wrap:anywhere}
.post .body{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.post .acts{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;align-items:center}
.post .acts button{background:none;border:0;padding:0;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.post .acts button:hover{color:var(--ink)}
.post .acts button.liked{color:var(--warn)}
.post .acts svg{width:16px;height:16px}
.post.hidden-post{opacity:.75;border-style:dashed}
.scores{display:flex;gap:16px;flex-wrap:wrap}
.score{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.dots{display:flex;gap:3px}
.dots i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--pine)}
.price{font-family:var(--f-data);font-weight:600;color:var(--ok);font-size:15px}
.thread{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.cmt{font-size:14px;display:flex;flex-direction:column;gap:2px;padding-left:10px;border-left:2px solid var(--line)}
.cmt .who{font-size:12px;color:var(--muted)}
.cform{display:flex;gap:8px}
.cform input{flex:1;min-width:0}

/* ---------- inbox ---------- */
.req{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.req .t{flex:1;min-width:180px}
.req .t small{display:block;color:var(--muted);font-size:12px}
.status{font-size:12px;font-weight:700;padding:1px 8px;border-radius:4px;background:var(--sunk)}
.status.ok{background:var(--pine-soft);color:var(--pine)}
.status.no{background:var(--warn-soft);color:var(--warn)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:min(60vh,520px);overflow-y:auto;padding:4px 2px}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--sunk);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.msg.mine{align-self:flex-end;background:var(--pine);color:var(--pine-ink)}
.msg small{display:block;font-family:var(--f-data);font-size:10px;opacity:.7;margin-top:2px}
.lock{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ok)}
.lock svg{width:14px;height:14px}

/* ---------- forms & sheets ---------- */
input[type=text],input[type=number],input[type=datetime-local],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;min-width:0}
label.f small,div.f small{color:var(--muted);font-weight:400}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;font-weight:400}
.radios input{accent-color:var(--pine)}
.rate{display:flex;flex-direction:column;gap:4px;font-size:13px}
.rate .stars{display:flex;gap:4px}
.rate .stars button{width:30px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-data);font-size:12px}
.rate .stars button.on{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;font-weight:400}
.check input{margin-top:4px;accent-color:var(--warn);width:16px;height:16px;flex:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-display);font-weight:900;font-size:21px;margin:0}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.err{color:var(--warn);font-size:13px;margin:0}
.suggest{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:40;max-width:calc(100vw - 32px)}

.gate{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.gate .hero{border-radius:0;min-height:240px}
.gate-card{max-width:460px;width:100%;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:14px}
.nick-row{display:flex;gap:8px}
.nick-row input{flex:1;min-width:0;font-size:17px;padding:10px 12px}

.tab.mobile-only{display:none}
@media (max-width:720px){ .tab.sec{display:none} .tab.mobile-only{display:flex} }
button.online-pill{background:none;border:0;padding:4px 6px;border-radius:8px}
button.online-pill:hover{background:var(--sunk)}
.only-narrow{display:none}
@media (max-width:640px){ .only-wide{display:none} .only-narrow{display:flex} }
.linkish{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.status.warnish{background:var(--bus-soft);color:var(--bus)}

.tt-wrap{overflow-x:auto}
.tt-grid{display:grid;gap:4px;min-width:560px}
.tt-dh{text-align:center;font-size:13px;font-weight:700;padding:4px 0;border-radius:6px;color:var(--muted)}
.tt-dh.today{background:var(--pine);color:var(--pine-ink)}
.tt-hours{position:relative}
.tt-hours span{position:absolute;right:4px;transform:translateY(-6px);font:11px var(--f-data);color:var(--muted)}
.tt-col{position:relative;border-radius:8px;background-color:var(--surface);background-image:linear-gradient(var(--line) 1px,transparent 1px);border:1px solid var(--line)}
.tt-col.today{border-color:var(--pine)}
.tt-c{position:absolute;left:3px;right:3px;border:0;border-radius:6px;color:#fff;padding:4px 6px;display:flex;flex-direction:column;align-items:flex-start;overflow:hidden;text-align:left;font-size:11px;line-height:1.3}
.tt-c b{font-size:12px}
.tt-item{display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.tt-time{font-size:13px;color:var(--muted);line-height:1.4}
.tt-info{display:flex;flex-direction:column;min-width:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}
.sw.on{border-color:var(--ink)}

.lmsg{display:flex;flex-direction:column;gap:2px;max-width:85%;align-self:flex-start}

.lwho{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted)}

.map-svg{display:block;width:100%;height:100%}

a.primary,a.ghost{display:inline-flex;align-items:center}

      if (dir==="out") out.push({ route:r, t:toMin(ncu), approx:r==="172A", sub: r==="172A" ? `中原大學 ${cy} 發車，到中大警衛室候車後開往高鐵` : `中大警衛室發車${hsr ? `・高鐵回程 ${hsr}` : ""}` });
      else if (hsr) out.push({ route:r, t:toMin(hsr), approx:false, sub:`高鐵站外 8 號月台上車` });
      else out.push({ route:r, t:toMin(ncu), approx:true, offBoard:true, sub:`中原大學 ${cy} 發車，經高鐵站（時間未公告），約此時到中大` }); }

let myKeys = null; const sharedKeys = {};
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function ensureKeys(){
  if (myKeys || !S.db || !S.uid || !crypto?.subtle) return myKeys;
  const ref = S.db.doc(`data/users/${S.uid}/keys`);
  const snap = await ref.get();
  let priv, pub;
  if (snap.exists){ ({ priv, pub } = snap.data()); }
  else {
    const kp = await crypto.subtle.generateKey({ name:"ECDH", namedCurve:"P-256" }, true, ["deriveKey"]);
    priv = await crypto.subtle.exportKey("jwk", kp.privateKey); pub = await crypto.subtle.exportKey("jwk", kp.publicKey);
    await ref.set({ priv, pub });
  }
  const pubDoc = await S.db.doc(`keys/${S.uid}`).get();
  if (!pubDoc.exists || pubDoc.data().pub?.x !== pub.x) await S.db.doc(`keys/${S.uid}`).set({ pub });
  myKeys = { priv: await crypto.subtle.importKey("jwk", priv, { name:"ECDH", namedCurve:"P-256" }, false, ["deriveKey"]) };
  return myKeys;
}
async function keyWith(peer){
  if (sharedKeys[peer]) return sharedKeys[peer];
  await ensureKeys(); if (!myKeys) throw new Error("nokey");
  const d = await S.db.doc(`keys/${peer}`).get(); if (!d.exists) throw new Error("peerkey");
  const pub = await crypto.subtle.importKey("jwk", d.data().pub, { name:"ECDH", namedCurve:"P-256" }, false, []);
  sharedKeys[peer] = await crypto.subtle.deriveKey({ name:"ECDH", public:pub }, myKeys.priv, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
  return sharedKeys[peer];
}
function openChat(peer, nick){
  closeChat(); S.chat = { peer, nick, err:"" }; S.chatMsgs = []; S.tab = "inbox"; LS.set("pc.tab","inbox");
  const tid = tidOf(S.uid, peer);
  S.unsubChat = S.db.collection(`dms/${tid}/msgs`).orderBy("ts","asc").limit(500).onSnapshot(async snap => {
    let key; try { key = await keyWith(peer); } catch { S.chat && (S.chat.err = "對方還沒開啟過松果的私訊功能，請等對方上線後再試。"); renderKeep(); return; }
    const out = [];
    for (const d of snap.docs){ const m = d.data();
      try { const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(m.iv) }, key, unb64(m.ct)); out.push({ mine:m.from===S.uid, text:new TextDecoder().decode(pt), ts:m.ts }); }
      catch { out.push({ mine:m.from===S.uid, text:"（無法解密這則訊息）", ts:m.ts }); } }
    S.chatMsgs = out; renderKeep();
  }, () => {});
  render();
}

function landmarkSheet(){
  const items = JSON.parse(JSON.stringify(landmarks())); const err = h("p",{class:"err",hidden:true});
  const ta = h("textarea",{id:"lm-ta",style:"min-height:140px"}, items.map(l => `${l.name}, ${l.lat}, ${l.lng}`).join("\n"));
  return sheet("編輯地圖地標",
    h("p",{class:"muted small",style:"margin:0"},"一行一個：名稱, 緯度, 經度。座標可從 Google 地圖複製。"), ta, err,
    foot(h("button",{class:"primary",onclick:async()=>{
      const out = []; for (const line of ta.value.split("\n").map(s=>s.trim()).filter(Boolean)){
        const m = line.match(/^(.+?)[,，]\s*(-?\d+\.\d+)\s*[,，]\s*(-?\d+\.\d+)$/); if (!m) return fail(err, "格式不對：" + line);
        out.push({ name:m[1].trim(), lat:+m[2], lng:+m[3] }); }
      try { await S.db.doc("config/landmarks").set({ items: out }); closeModal(); toast("地標已更新"); } catch(e){ fail(err, writeErr(e)); } }},"儲存")));
}

function onlinePeople(){

    const cur = m.get(p.by); if (!cur || (p.updatedAt||0) > (cur.updatedAt||0)) m.set(p.by, p); }

let remindTimers = [];
function scheduleReminders(){
  remindTimers.forEach(clearTimeout); remindTimers = [];
  const T = tt(); if (!T.remindOn) return;
  const now = new Date(); const dow = todayDow(); const cur = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  for (const c of T.courses){ if (+c.day !== dow) continue;
    const at = toMin(c.start) - (+T.remind||10); if (at <= cur) continue;
    remindTimers.push(setTimeout(() => {
      const msg = `${c.name} ${c.start} 開始${c.room ? "・" + c.room : ""}`;
      toast("上課提醒：" + msg);
      try { if ("Notification" in window && Notification.permission==="granted"){
        if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification("松果上課提醒", { body:msg, icon:"/icons/icon-192.png", tag:"class-"+c.id }));
        else new Notification("松果上課提醒", { body:msg, icon:"/icons/icon-192.png" }); } } catch {}
    }, (at - cur) * 60000)); }
  // re-plan after midnight
  remindTimers.push(setTimeout(scheduleReminders, ((24*60 - cur) + 1) * 60000));
}
function downloadIcs(){
  const T = tt(); const pad2 = n => String(n).padStart(2,"0");
  const stamp = d => `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
  const until = (T.until || "2027-01-15").replace(/-/g,"") + "T235959";
  const escI = s => String(s||"").replace(/[\\;,]/g, m => "\\"+m).replace(/\n/g,"\\n");
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//songguo//timetable//ZH","CALSCALE:GREGORIAN","X-WR-CALNAME:松果課表","X-WR-TIMEZONE:Asia/Taipei"];
  const base = new Date(); base.setHours(0,0,0,0);
  for (const c of T.courses){
    const d = new Date(base); const diff = ((+c.day % 7) - d.getDay() + 7) % 7; d.setDate(d.getDate() + diff);
    const s = new Date(d), e = new Date(d); s.setHours(...c.start.split(":").map(Number)); e.setHours(...c.end.split(":").map(Number));
    lines.push("BEGIN:VEVENT", `UID:${c.id}@songguo`, `DTSTAMP:${stamp(new Date())}`, `DTSTART;TZID=Asia/Taipei:${stamp(s)}`, `DTEND;TZID=Asia/Taipei:${stamp(e)}`,
      `RRULE:FREQ=WEEKLY;UNTIL=${until}`, `SUMMARY:${escI(c.name)}`, c.room ? `LOCATION:${escI(c.room)}` : null, c.teacher ? `DESCRIPTION:${escI(c.teacher)}` : null,
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${escI(c.name)}`,`TRIGGER:-PT${+T.remind||10}M`,"END:VALARM","END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.filter(Boolean).join("\r\n")], { type:"text/calendar" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "松果課表.ics"; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("已下載課表檔，打開它就能加入手機行事曆");
}

    const layer = L.layerGroup().addTo(map);

      S.dragging = false; if (S.dirty && !S.modal){ S.dirty = false; setTimeout(renderKeep); } });
    map.on("click", e => { if (!mapPlacing) return; const cb = mapPlacing; mapPlacing = null; cb({ lat:e.latlng.lat, lng:e.latlng.lng }); });

  if (opts.rings) [[400,"走路 5 分"],[800,"走路 10 分"],[1600,"走路 20 分"]].forEach(([r,l]) =>
    L.circle([ORIGIN.lat, ORIGIN.lng], { radius:r, color:pine, weight:1.5, dashArray:"4 6", fill:false, interactive:false }).addTo(M.layer).bindTooltip(l, { direction:"top" }));

  for (const k of opts.markers){
    const mk = L.circleMarker([k.lat, k.lng], { radius: k.sel ? 11 : 8, color: k.dim ? (css.getPropertyValue("--muted").trim()||"#888") : "#ffffff", weight:2, dashArray: k.dash ? "3 3" : null,

    mk.bindTooltip(k.label, { direction:"top", offset:[0,-8], permanent: !!k.sel });

  }
  const wrap = h("div",{class:"map-wrap"}, M.el,
    h("div",{class:"map-hint",hidden:!mapPlacing}, "點地圖選位置", h("button",{class:"ghost",onclick:e=>{ e.stopPropagation(); const cb = mapPlacing; mapPlacing = null; cb && cb(null); }},"取消")),
    h("button",{class:"ghost map-home",onclick:()=>M.map.setView(opts.center, opts.zoom)},"回到中大"));

      S.nick=v; S.dept=dept.value; S.home=home.value; LS.set("pc.nick",v); dept.value?LS.set("pc.dept",dept.value):LS.del("pc.dept"); home.value?LS.set("pc.home",home.value):LS.del("pc.home");
      saveProfile(); presence(); toast("已儲存"); closeModal(); }},"儲存")));
}

    h("div",{class:"foot"}, h("button",{class:"primary",onclick:closeModal},"知道了")));

function locSheet(){
  const st = { type: HOUSE_TYPES[0] };
  const err = h("p",{class:"err",hidden:true}), sug = h("div",{class:"suggest",hidden:true});
  const name = h("input",{type:"text",id:"loc-name",maxlength:"30",placeholder:"例：中央路 XX 號透天"});
  const lane = h("input",{type:"text",id:"loc-lane",maxlength:"20",placeholder:"例：232 巷"});
  const zone = h("select",{id:"loc-zone"}, ZONES.map(z => h("option",{value:z.id},z.name)));
  const type = h("div",{class:"radios",role:"radiogroup"}, HOUSE_TYPES.map((t,i) => h("label",{}, h("input",{type:"radio",name:"ltype",checked:i===0,onchange:()=>st.type=t}),t)));
  const check = () => { const hits = similarLocs(name.value.trim(), lane.value.trim()); sug.replaceChildren();
    if (hits.length){ sug.hidden=false; sug.append(h("span",{},"這些社區跟你輸入的很像，是同一個地方嗎？直接加入就能找到同棟鄰居："),
      h("div",{class:"ideas"}, hits.slice(0,5).map(l => h("button",{onclick:()=>{ S.home="h:"+l.id; LS.set("pc.home",S.home); saveProfile(); S.modal=null; go("housing","h:"+l.id); toast("已加入 "+l.name); }}, l.name+(l.lane?`（${l.lane}）`:""))))); }
    else sug.hidden = true; return hits; };
  name.addEventListener("input", check); lane.addEventListener("input", check);
  const btn = h("button",{class:"primary",onclick:async()=>{
    const nm = name.value.trim(); const hits = check();
    if (nm.length<2) return fail(err,"請輸入租屋處名稱（至少 2 個字）。");
    if (hits.some(l => norm(l.name)===norm(nm))) return fail(err,"已經有同名的社區了，請直接加入上面的頻道。");
    if (!canPost()) return fail(err,"目前無法寫入資料，所以不能新增社區。");
    btn.disabled = true;
    try { const ref = S.db.collection("locations").doc(); await ref.set({ name:nm, lane:lane.value.trim(), zone:zone.value, type:st.type, by:S.uid||"", ts:Date.now() });
      const id = "h:c-"+ref.id; S.home = id; LS.set("pc.home",id); saveProfile(); S.modal=null; go("housing",id); toast("已建立「"+nm+"」大廳"); }
    catch(e){ fail(err, writeErr(e)); btn.disabled=false; } }},"建立社區頻道");
  return sheet("新增我的租屋處",
    h("p",{class:"muted small",style:"margin:0"},"建立後會產生這棟的專屬大廳，之後輸入相同名稱的人會被引導加入同一個頻道。"),
    h("label",{class:"f",for:"loc-name"},"租屋名稱",name),
    h("div",{class:"frow"}, h("label",{class:"f",for:"loc-zone"},"區域",zone), h("label",{class:"f",for:"loc-lane"},"巷弄（選填）",lane)),
    h("div",{class:"f"},"房屋類型",type), sug, err, foot(btn));
}

function postSheet(){
  const sp = spaceById(S.modal.space); if (!sp) return sheet("找不到這個版", foot());
  const st = { cat:sp.cats[0], oneTime:false, nick:S.nick, ratings:{sound:0,landlord:0,cp:0}, agree:false };
  const err = h("p",{class:"err",hidden:true});
  const title = h("input",{type:"text",id:"p-title",maxlength:"60",value:S.modal.prefill||"",placeholder:"標題"});
  const body = h("textarea",{id:"p-body",maxlength:"3000",placeholder: sp.review ? "具體寫下你遇到的事實：時間、狀況、房東怎麼處理。避免人身攻擊與未經證實的猜測。" : sp.price ? "物品狀況、使用多久、面交地點與時間。" : "想說什麼？"});
  const draftKey = "pc.draft."+sp.id; const draft = LS.json(draftKey, null);
  if (draft && !S.modal.prefill){ title.value = draft.t||""; body.value = draft.b||""; }
  const saveDraft = () => LS.set(draftKey, JSON.stringify({ t:title.value, b:body.value }));
  title.addEventListener("input", saveDraft); body.addEventListener("input", saveDraft);
  const price = sp.price ? h("input",{type:"text",id:"p-price",maxlength:"20",placeholder:"例：NT$300、免費"}) : null;
  const rent = sp.rent ? h("input",{type:"text",id:"p-rent",maxlength:"24",placeholder:"例：月租 6,500（含水）"}) : null;
  const htype = sp.rent ? h("select",{id:"p-htype"}, HOUSE_TYPES.map(t => h("option",{},t))) : null;
  const about = sp.review || sp.rent ? h("select",{id:"p-about"}, h("option",{value:""},"（不指定）"), homeOptions().filter(g => g.group.startsWith("校外")).map(g => h("optgroup",{label:g.group.replace("校外・","")}, g.items.map(it => h("option",{value:it.id,selected:S.home===it.id},it.name))))) : null;
  const nickLabel = h("span",{class:"mono"}, S.nick);
  const ident = h("div",{class:"radios",role:"radiogroup","aria-label":"發文身分"},
    h("label",{}, h("input",{type:"radio",name:"ident",checked:true,onchange:()=>{st.oneTime=false;st.nick=S.nick;nickLabel.textContent=S.nick;}}),"用我的暱稱"),
    h("label",{}, h("input",{type:"radio",name:"ident",onchange:()=>{st.oneTime=true;st.nick=randNick();nickLabel.textContent=st.nick;}}),"一次性隨機暱稱"));
  const rate = (key,label) => { const wrap = h("div",{class:"stars"});
    const draw = () => wrap.replaceChildren(...[1,2,3,4,5].map(n => h("button",{type:"button",class:n<=st.ratings[key]?"on":"","aria-label":`${label} ${n} 分`,onclick:()=>{st.ratings[key]=n;draw();}},n)));
    draw(); return h("div",{class:"rate"}, label, wrap); };
  const agree = sp.review ? h("label",{class:"check"}, h("input",{type:"checkbox",id:"p-agree",onchange:e=>{st.agree=e.target.checked;btn.disabled=!st.agree;}}), h("span",{}, h("b",{},"我已閱讀並同意免責聲明："), DISCLAIMER)) : null;
  const btn = h("button",{class:"primary",disabled:!!sp.review,onclick:async()=>{
    const t = title.value.trim(), b = body.value.trim();
    if (!t) return fail(err,"請填寫標題。");
    if (b.length<4) return fail(err,"內容太短了，再多寫一點。");
    if (sp.review && !st.agree) return fail(err,"發表避雷文前必須勾選同意免責聲明。");
    if (sp.review && (!st.ratings.sound||!st.ratings.landlord||!st.ratings.cp)) return fail(err,"請完成三項評分。");
    const doc = { space:sp.id, title:t, body:b, cat:st.cat, nick:st.nick, oneTime:st.oneTime, uid:S.uid||"", ts:Date.now() };
    if (sp.review){ doc.ratings = {...st.ratings}; doc.agreedDisclaimer = true; }
    if (about && about.value) doc.about = about.value;
    if (price && price.value.trim()) doc.price = price.value.trim();
    if (rent && rent.value.trim()) doc.rent = rent.value.trim();
    if (htype) doc.htype = htype.value;
    btn.disabled = true;
    try { await S.db.collection("posts").add(doc); LS.del(draftKey); closeModal(); toast("已發布"); }
    catch(e){ fail(err, writeErr(e)); btn.disabled = false; } }},"發布");
  return sheet("發文到「"+sp.name+"」",
    h("div",{class:"f"},"分類", h("div",{class:"radios",role:"radiogroup"}, sp.cats.map((c,i) => h("label",{}, h("input",{type:"radio",name:"pcat",checked:i===0,onchange:()=>st.cat=c}),c)))),
    about ? h("label",{class:"f",for:"p-about"}, sp.review ? "評論的租屋處" : "房子在哪", about) : null,
    h("label",{class:"f",for:"p-title"},"標題",title),
    price ? h("label",{class:"f",for:"p-price"},"價格",price) : null,
    rent ? h("div",{class:"frow"}, h("label",{class:"f",for:"p-rent"},"租金",rent), h("label",{class:"f",for:"p-htype"},"房型",htype)) : null,
    h("label",{class:"f",for:"p-body"},"內容", h("small",{},"打到一半關掉也沒關係，草稿會自動保留。"), body),
    sp.review ? h("div",{class:"frow"}, rate("sound","隔音"), rate("landlord","房東態度"), rate("cp","CP 值")) : null,
    h("div",{class:"f"}, h("span",{},"發文身分　", nickLabel), ident),
    agree, err, foot(btn));
}

function rideSheet(){
  const m = S.modal; const err = h("p",{class:"err",hidden:true});
  const d = new Date(Date.now()+60*60e3); d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0);
  const local = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const sel = (id, v) => h("select",{id}, RIDE_PLACES.map(p => h("option",{selected:p===v},p)));
  const from = sel("r-from", m.from || "中央大學（後門）"), to = sel("r-to", m.to || "中壢火車站");
  const when = h("input",{type:"datetime-local",id:"r-when",value:local});
  const seats = h("select",{id:"r-seats"}, [2,3,4,5,6].map(n => h("option",{value:n,selected:n===4}, `${n} 人（含我）`)));
  const split = h("select",{id:"r-split"}, ["車資平分","先到先付・現場再算","我出車・每人固定費用"].map(s => h("option",{},s)));
  const note = h("input",{type:"text",id:"r-note",maxlength:"60",placeholder:"例：在後門 7-11 集合、有大行李"});
  const btn = h("button",{class:"primary",onclick:async()=>{
    const ts = new Date(when.value).getTime();
    if (!ts || ts < Date.now()-5*60e3) return fail(err,"出發時間要在現在之後。");
    if (from.value===to.value) return fail(err,"出發地和目的地不能一樣。");
    btn.disabled = true;
    try { await S.db.collection("rides").add({ from:from.value, to:to.value, when:ts, seats:+seats.value, split:split.value, note:note.value.trim(), nick:S.nick, uid:S.uid||"", ts:Date.now() }); closeModal(); toast("已開團"); }
    catch(e){ fail(err, writeErr(e)); btn.disabled=false; } }},"開團");
  return sheet("開一團拼車",
    h("div",{class:"frow"}, h("label",{class:"f",for:"r-from"},"出發",from), h("label",{class:"f",for:"r-to"},"目的地",to)),
    h("div",{class:"frow"}, h("label",{class:"f",for:"r-when"},"出發時間",when), h("label",{class:"f",for:"r-seats"},"總人數",seats)),
    h("label",{class:"f",for:"r-split"},"車資",split),
    h("label",{class:"f",for:"r-note"},"備註（選填）",note),
    h("p",{class:"muted small",style:"margin:0"},"為了安全，請在校內或人多的地方集合；不要在公開留言區留下電話，需要時用私訊交換。"),
    err, foot(btn));
}
function delRideSheet(){
  const id = S.modal.id;
  return sheet("取消這團？", h("p",{class:"muted",style:"margin:0"},"已加入的人會看到這團消失。"),

}

function dmReqSheet(){
  const m = S.modal; const err = h("p",{class:"err",hidden:true});
  const existing = [...S.reqOut].find(r => r.to===m.to);
  const note = h("input",{type:"text",id:"dm-note",maxlength:"80",placeholder:"例：你好，我也住 3 樓，想問一下烘衣機的事"});

  if (m.to===S.uid) return sheet("這是你自己", foot());

    h("p",{class:"muted small",style:"margin:0"},"對方同意後才會開啟對話。對話內容會加密，只有你們兩個看得到；要不要透露真實身分或聯絡方式由你們自己決定。"),

    h("label",{class:"f",for:"dm-note"},"打個招呼（選填）",note), err,

      try { await ensureKeys(); await S.db.doc(`dmreq/${S.uid}__${m.to}`).set({ from:S.uid, to:m.to, fromNick:S.nick, toNick:m.toNick, note:note.value.trim(), space:m.from||"", status:"pending", ts:Date.now() });
        closeModal(); toast("已送出請求"); } catch(e){ fail(err, writeErr(e)); } }}, existing ? "重新送出" : "送出請求")));
}

function reportSheet(){
  const pid = S.modal.pid; let reason = "人身攻擊或謾罵"; const err = h("p",{class:"err",hidden:true});
  return sheet("檢舉這篇貼文",
    h("div",{class:"radios",role:"radiogroup"}, ["人身攻擊或謾罵","捏造不實內容","洩漏個人資料","廣告或詐騙","其他"].map((r,i)=>h("label",{},h("input",{type:"radio",name:"rr",checked:i===0,onchange:()=>reason=r}),r))),
    h("p",{class:"muted small",style:"margin:0"},"同一篇貼文被 3 位不同使用者檢舉後會自動暫時隱藏，等管理員審核。"), err,
    foot(h("button",{class:"primary",onclick:async()=>{ if (!S.uid) return fail(err,"無法辨識你的身分，所以不能檢舉。");
      try { await S.db.doc(`reports/${pid}__${S.uid}`).set({ post:pid, uid:S.uid, reason, ts:Date.now() }); closeModal(); toast("已檢舉，累積 3 次會自動隱藏"); } catch(e){ fail(err, writeErr(e)); } }},"送出檢舉")));
}
function delSheet(){
  const pid = S.modal.pid;
  return sheet("刪除這篇貼文？", h("p",{class:"muted",style:"margin:0"},"刪除後無法復原。"),
    foot(h("button",{class:"primary",onclick:async()=>{ try { await S.db.doc("posts/"+pid).delete(); if (S.open===pid) closeThread(); closeModal(); toast("已刪除"); } catch(e){ toast(writeErr(e)); } }},"刪除")));
}

function writeErr(e){
  const c = e && e.code;
  if (c==="invalid_argument"){ S.canWrite = false; return "你目前沒有寫入權限，只能瀏覽。"; }
  if (c==="quota_exceeded") return "資料庫空間已滿，請管理員清理舊資料。";
  if (c==="resource_exhausted") return "操作太頻繁了，稍等幾秒再試。";
  return "沒有送出成功，請檢查網路後再試一次。";
}
let toastEl = null, toastT = 0;
function toast(msg){ if (!toastEl){ toastEl = h("div",{class:"toast",role:"status"}); document.body.append(toastEl); }
  toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>toastEl.hidden=true, 2600); }

scheduleReminders();
/* ---------- PWA ---------- */
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; });
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));

/* ---------- profile persistence (per account, private) ---------- */
let profSaving = Promise.resolve();
function saveProfile(){
  if (!S.db || !S.uid || S.canWrite===false) return;
  profSaving = profSaving.then(() => S.db.doc(`data/users/${S.uid}/profile`).set({ nick:S.nick, dept:S.dept, home:S.home, ts:Date.now() })).catch(()=>{});
}

/* =====================================================================
   BOOT
   ===================================================================== */
render();
setInterval(() => { if (S.nick) renderKeep(); }, 30000);

(async () => {
  const cl = window.claude;
  if (!cl || !cl.use){ S.dbState = "none"; render(); return; }
  const [db, user, room] = await Promise.all([cl.use("db"), cl.use("user"), cl.use("room")]);
  if (user){
    try { S.uid = await user.id(); } catch {}
    try { S.isOwner = !!user.isOwner(); } catch {}
    try { S.canEdit = !!(await user.canEdit()); } catch {}
    try { const w = await user.can("data.write"); if (w === false) S.canWrite = false; } catch {}
  }
  if (!db){ S.dbState = "none"; render(); return; }
  S.db = db;
  // restore profile from account (works across devices / after clearing the browser)
  if (S.uid){
    try { const p = await db.doc(`data/users/${S.uid}/profile`).get();
      if (p.exists){ const d = p.data(); if (d.nick) { S.nick = d.nick; LS.set("pc.nick", d.nick); } if (d.dept != null){ S.dept = d.dept; LS.set("pc.dept", d.dept); } if (d.home != null){ S.home = d.home; LS.set("pc.home", d.home); } }
      else if (S.nick) saveProfile();
    } catch {}
  }
  const sub = (q, fn) => q.onSnapshot(s => { fn(s); renderKeep(); }, () => {});
  sub(db.collection("posts").orderBy("ts","desc").limit(1000), s => { S.posts = s.docs.map(d => ({ id:d.id, ...d.data() })); if (S.dbState==="loading") S.dbState = "ok"; });
  sub(db.collection("locations").limit(500), s => { S.customLocs = s.docs.map(d => { const x = d.data(); return { id:"c-"+d.id, name:x.name, zone:x.zone||"ot", lane:x.lane||"", custom:true }; }); });
  sub(db.collection("likes").limit(1000), s => { const m = {}; for (const d of s.docs){ const x = d.data(); (m[x.post] ||= new Set()).add(x.uid); } S.likes = m; });
  sub(db.collection("reports").limit(1000), s => { const m = {}; for (const d of s.docs){ const x = d.data(); (m[x.post] ||= new Set()).add(x.uid); } S.reports = m; });
  sub(db.collection("rides").orderBy("when","desc").limit(200), s => { S.rides = s.docs.map(d => ({ id:d.id, ...d.data() })); });
  sub(db.collection("spots").limit(800), s => { S.spots = s.docs.map(d => ({ id:d.id, ...d.data() })).filter(x => typeof x.lat==="number" && typeof x.lng==="number"); });
  if (S.uid){ db.doc(`data/users/${S.uid}/timetable`).get().then(d => { if (d.exists){ const t = d.data(); if (t && Array.isArray(t.courses)){ S.timetable = t; LS.set("pc.tt", JSON.stringify(t)); scheduleReminders(); renderKeep(); } }
      else if (S.timetable && S.timetable.courses.length && S.canWrite !== false) db.doc(`data/users/${S.uid}/timetable`).set(S.timetable).catch(()=>{}); }).catch(()=>{}); }
  ensureLobby(S.tab==="forum");
  sub(db.collection("food").limit(800), s => { S.food = s.docs.map(d => ({ id:d.id, ...d.data() })).filter(x => typeof x.lat==="number" && typeof x.lng==="number"); });
  sub(db.collection("foodrate").limit(2000), s => { const m = {}; for (const d of s.docs){ const x = d.data(); (m[x.food] ||= new Map()).set(x.uid, x.stars); } S.foodRates = m; });
  db.doc("config/landmarks").onSnapshot(s => { S.landmarks = s.exists && Array.isArray(s.data().items) ? s.data().items : null; renderKeep(); }, () => {});
  sub(db.collection("riders").limit(1000), s => { const m = {}; for (const d of s.docs){ const x = d.data(); (m[x.ride] ||= new Map()).set(x.uid, x.nick); } S.riders = m; });
  db.doc("config/bus").onSnapshot(s => { S.busCfg = s.exists && s.data().hsrMode ? s.data() : null; renderKeep(); }, () => {});
  if (S.uid){
    sub(db.collection("dmreq").where("to","==",S.uid), s => { S.reqIn = s.docs.map(d => ({ id:d.id, ...d.data() })); });
    sub(db.collection("dmreq").where("from","==",S.uid), s => { S.reqOut = s.docs.map(d => ({ id:d.id, ...d.data() })); });
    if (S.canWrite !== false) ensureKeys().catch(() => {});
  }
  if (room){
    S.room = room;
    room.onPeers(ch => { S.peers = ch.peers; renderKeep(); }, () => { S.room = null; renderKeep(); });
    presence();
  }
  render();
})();
})();
